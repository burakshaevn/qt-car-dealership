name: Build & test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  BUILD_TYPE: Release
  # 6.9.2+ is required on macos-latest: older Qt links the AGL framework,
  # which the Xcode 26 SDK no longer ships (QTBUG-137687).
  QT_VERSION: 6.9.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # SQLite driver (QSQLITE) ships with Qt, no external database is needed.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: true

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: build
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
